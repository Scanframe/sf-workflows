services:
  runner:
    image: myoung34/github-runner:latest
    privileged: true
    # Give the container a name as the runner.
    container_name: ${GITHUB_RUNNER_NAME}${GITHUB_RUNNER_SUFFIX:-}
    # Use the network stack of the host (DNS, proxy, VPN routes) instead of a compose bridge network.
    # Only affects the runner container: job containers ('container:') are started by the host Docker daemon
    # on a network the runner creates per job.
    network_mode: host
    restart: unless-stopped
    environment:
      # Place sensitive values in a .env file next to this compose file.
      # Use RUNNER_TOKEN (manually generated from GitHub UI) instead of ACCESS_TOKEN.
      # ACCESS_TOKEN requires org owner permissions, which often causes 403 errors.
      #RUNNER_TOKEN: ${GH_RUNNER_TOKEN}
      ACCESS_TOKEN: ${GITHUB_PAT}
      # For organization-level runners (needs a GitHub organization):
      RUNNER_SCOPE: org
      ORG_NAME: ${GITHUB_ORG}
      RUNNER_NAME: ${GITHUB_RUNNER_NAME}${GITHUB_RUNNER_SUFFIX:-}
      RUNNER_WORKDIR: /tmp/runner${GITHUB_RUNNER_SUFFIX:-}/work
      # Custom label used in workflows (runs-on: [sf-build]).
      # Default labels (self-hosted, linux, x64) are added automatically.
      LABELS: sf-build
      # Ephemeral mode: automatically unregister and stop after each job.
      EPHEMERAL: "true"
      # Unset all config env vars after registration to prevent leaking secrets.
      UNSET_CONFIG_VARS: "true"
      # Disable auto-updates so the runner image version stays in control.
      DISABLE_AUTO_UPDATE: "true"
      # Script run before every job to give it an empty workspace like a GitHub-hosted runner (see job-started.sh).
      ACTIONS_RUNNER_HOOK_JOB_STARTED: /opt/runner-hooks/job-started.sh
      # Run the runner as user 'runner' (uid 1001) like the GitHub-hosted runners, so the workspace is not owned by
      # root. The build image entrypoint takes the build user uid:gid from the workspace owner and fails on 0:0.
      # The image entrypoint aligns the 'docker' group gid with the mounted socket and chowns the work directory.
      RUN_AS_ROOT: "false"
    security_opt:
      - label:disable
    volumes:
      # Docker socket for Docker-in-Docker support (required for --privileged jobs).
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent runner registration data (only needed without EPHEMERAL mode).
      #- ./runner/data:/runner/data
      # Work directory — must be the same path on host and in container.
      - /tmp/runner${GITHUB_RUNNER_SUFFIX:-}:/tmp/runner${GITHUB_RUNNER_SUFFIX:-}
      # Job-started hook script.
      - ./job-started.sh:/opt/runner-hooks/job-started.sh:ro
      # Runner externals (node20/node24) must exist on the HOST at the SAME path, because job containers
      # are started by the host Docker daemon and mount them as /__e. See README 'Container jobs'.
      - /actions-runner/externals:/actions-runner/externals
