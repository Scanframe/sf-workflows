services:
  runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    environment:
      # Put it in a .env file next to this one.
      ACCESS_TOKEN: ${GH_RUNNER_PAT}        
      RUNNER_SCOPE: org
      ORG_NAME: Scanframe
      RUNNER_NAME: sf-build-01
      RUNNER_WORKDIR: /tmp/runner/work
      LABELS: sf-build
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/data
      UNSET_CONFIG_VARS: "true"
    security_opt:
      - label:disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /runner/data:/runner/data
      # Same path on host and in container, required for job containers.
      - /tmp/runner:/tmp/runner     
