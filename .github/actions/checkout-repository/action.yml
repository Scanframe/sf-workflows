---
# Composite action: Checkout repository with shared setup steps.
# Wraps actions/checkout@v4 and includes an option to check out the latest version of a given branch.
# Used by: check-env, build, linux-gcov, deploy-develop, deploy-staging, deploy-stable.

name: 'Checkout Repository'
description: 'Checkout repository with shared setup steps'

inputs:
  submodules:
    description: 'Initialize submodules (recursive, shallow, or false)'
    required: false
    default: 'recursive'
  fetch-depth:
    description: 'Number of commits to fetch (0 for full history)'
    required: false
    default: ''
  cmake-lib-branch:
    description: 'Branch to update the cmake/lib submodule to (empty to skip)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: ${{ inputs.submodules }}
        fetch-depth: ${{ inputs.fetch-depth }}
    - name: Update 'cmake/lib' submodule
      # Ignore when CMAKE_LIB_BRANCH is empty or "none".
      if: inputs.cmake-lib-branch != '' || inputs.cmake-lib-branch == 'none'
      shell: bash
      env:
        CMAKE_LIB_BRANCH: ${{ inputs.cmake-lib-branch }}
      run: |
        echo "Mark workspace as safe."
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        # Prevent shell injection.
        if [[ ! "${CMAKE_LIB_BRANCH}" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ ]]; then
          echo "::error::Invalid branch name for 'cmake/lib': '${CMAKE_LIB_BRANCH}'"
          exit 1
        fi
        # Make sure the 'cmake/lib' directory exists before attempting to update it.
        if [ -d "cmake/lib" ]; then
          echo "::notice::Updating 'cmake/lib' submodule to branch '${CMAKE_LIB_BRANCH}'"
          git config -f .gitmodules submodule.cmake/lib.branch "${CMAKE_LIB_BRANCH}"
          git submodule update --init --remote -- cmake/lib
        else
          echo "::notice::Submodule directory 'cmake/lib' not found. Skipping update to '${CMAKE_LIB_BRANCH}'."
        fi
