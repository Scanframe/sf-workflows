# Composite action: Publishes and reports the coverage generated by a coverage build in the same job.
# Equivalent of the GitLab 'job-coverage' publish and 'cmake/lib/bin/coverage-comment.sh' steps:
#  - Publishes the report files ('report.*') to the Nexus exchange repository.
#  - Writes the text report to the log and the job summary.
#  - Comments on the pull request with a link to the HTML report on Nexus and the workflow run.
# Used by: linux-gcov.
# Needs the Nexus variables (NEXUS_USER, NEXUS_PASSWORD, NEXUS_SERVER_URL, NEXUS_EXCHANGE_REPO) in the job environment.
# Uses curl and jq instead of the GitHub CLI since it runs in the build container.
# Commenting needs 'pull-requests: write' on the calling job and is not possible for pull requests from forks.

name: 'Coverage Report'
description: 'Publish the coverage report to Nexus and report it in the job summary and as a pull request comment'

inputs:
  gcovr-dir:
    description: 'Directory containing the coverage report files (report.*)'
    required: false
    default: 'bin/gcov'
  exchange-dir:
    description: 'Sub-directory in the Nexus exchange repository to publish the report files to'
    required: true
  github-token:
    description: 'Token used to comment on the pull request'
    required: false
    default: ${{ github.token }}
  pr-number:
    description: 'Number of the pull request to comment on (no comment when empty)'
    required: false
    default: ${{ github.event.pull_request.number }}

runs:
  using: 'composite'

  steps:
    - name: Publish coverage report to Nexus
      shell: bash
      env:
        GCOVR_DIR: ${{ inputs.gcovr-dir }}
        EXCHANGE_DIR: ${{ inputs.exchange-dir }}
      run: |
        git config --global --add safe.directory '*'
        ./build.py --verbose publish --exchange "${EXCHANGE_DIR}" "${GCOVR_DIR}/report".*

    - name: Report coverage
      shell: bash
      env:
        GCOVR_DIR: ${{ inputs.gcovr-dir }}
        EXCHANGE_DIR: ${{ inputs.exchange-dir }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        report="${GCOVR_DIR}/report.txt"
        # Output the text report to the log and the job summary.
        if [[ -f "${report}" ]]; then
          cat "${report}"
          printf '### Coverage Report\n```\n%s\n```\n' "$(cat "${report}")" >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "No coverage report found at '${report}'."
        fi
        # Add a comment to the pull request when permitted (not possible for forks).
        if [[ -z "${PR_NUMBER}" ]]; then
          echo "Not adding comment, not a pull request."
          exit 0
        fi
        # URL to the report on Nexus.
        report_url="${NEXUS_SERVER_URL%/}/repository/${NEXUS_EXCHANGE_REPO}/${EXCHANGE_DIR}/report.html"
        # URL to the workflow run generating the report.
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        body="[Coverage report](${report_url} \"Link to coverage report on nexus.\") generated by [run-${GITHUB_RUN_ID}](${run_url} \"Link to responsible workflow run.\") is available."
        if jq --null-input --arg body "${body}" '{body: $body}' |
          curl --silent --show-error --fail-with-body --output /dev/null \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"; then
          echo "Coverage comment succeeded."
        else
          echo "Coverage comment failed!"
        fi
