# GitHub Actions reusable CI pipeline (called using 'workflow_call' from the workflow of a project).
# Equivalent of the GitLab pipeline in 'gitlab-ci/main.gitlab-ci.yml' without the testing capabilities ('SF_SIGNAL').
#
# The triggers ('push', 'pull_request', 'workflow_dispatch') and the 'concurrency' belong in the calling workflow.
# See 'README.md' in the '.github' directory for usage and a caller template.
#
# The composite actions are referenced using '<owner>/<central-repo>/.github/actions/<name>@main' because a local
# './.github/actions/...' path resolves in the workspace of the caller. Replace '<owner>/<central-repo>' with the
# location of this repository and release this workflow and the actions together under the same tag.
#
# Repository settings of the calling repository used:
#   Variables (optional):
#     SF_RELEASE_BRANCH : Name of the branch allowing deployment to 'staging' and 'stable' (default: main).
#   Secrets (repository or organization secrets, passed using 'secrets: inherit'):
#     NEXUS_USER, NEXUS_PASSWORD, NEXUS_SERVER_URL, NEXUS_RAW_REPO, NEXUS_EXCHANGE_REPO, NEXUS_WINGET_REFRESH
#   Environments: 'staging' and 'stable' which can override the secrets.

name: CI

on:
  workflow_call:
    inputs:
      skip_build:
        description: 'Skip build and beyond'
        type: boolean
        default: false
      deploy:
        description: "Manual deploy of the packages from the release branch: 'none', 'staging' or 'stable'"
        type: string
        required: false
        default: 'none'
      docker-image:
        description: 'Docker image used to run the build and deploy jobs in'
        type: string
        required: true
      matrix:
        description: >-
          JSON object with an 'include' list of toolchains to build. Each entry has the keys
          'name', 'toolchain', 'build-cmd' and 'bin-dir'.
        type: string
        required: false
        # Disabled entries (comments are not possible inside the folded value below):
        default: >-
          {"include":[
          {"name":"linux-gnu","toolchain":"gnu","build-cmd":"/home/user/bin/entrypoint.sh ./build.py native --verbose","bin-dir":"bin/lnx64"},
          {"name":"linux-gw","toolchain":"gw","build-cmd":"/home/user/bin/entrypoint.sh ./build.py native --verbose","bin-dir":"bin/win64"},
          {"name":"linux-ga","toolchain":"ga","build-cmd":"/home/user/bin/entrypoint.sh ./build.py native --verbose","bin-dir":"bin/lnx64"},
          {"name":"wine-msvc","toolchain":"msvc","build-cmd":"/home/user/bin/entrypoint.sh ./build.py wine -- native --verbose","bin-dir":"bin/win64"}
          ]}
      coverage:
        description: 'Run the coverage jobs for pull requests and manual runs'
        type: boolean
        required: false
        default: true
    secrets:
      NEXUS_PASSWORD:
        description: "Nexus account password for uploading packages."
        required: true

# Permissions needed by the jobs. A called workflow can not elevate beyond the permissions granted by the caller.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SF_TARGET_ARCH: 'amd64'
  SF_TARGET_OS: 'linux'
  SF_DIR_PKG: 'bin/pkg'
  SF_GCOVR_DIR: 'bin/gcov'
  # Nexus exchange directory for the coverage reports (GitLab uses 'gitlab-ci/<project>/pipeline/<id>').
  SF_EXCHANGE_DIR: 'github-actions/${{ github.repository }}/run/${{ github.run_id }}'

jobs:

  # ------------------------------------------------------------------
  # check-env: Reports the environment and checks the code formatting.
  # ------------------------------------------------------------------
  check-env:
    # Same as GitLab: pull requests, manual runs and pushes to protected branches only to prevent duplicate runs.
    if: github.event_name != 'push' || github.ref_protected
    # Anchors defined here are reused by the other jobs.
    # A 'runs-on' list needs a runner having ALL labels, it is not a fallback list.
    # Set variable SF_RUNNER_LABELS (JSON) to use the self-hosted runner, e.g. ["sf-build"]. Default: GitHub-hosted.
    runs-on: &runs-on ${{ fromJSON(vars.SF_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: &build-timeout 120
    container: &build-container
      image: &build-image ${{ inputs.docker-image }}
      options: --privileged
    env:
      DEBUG: ${{ vars.ENTRY_DEBUG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Print environment
        run: |
          echo "Working Directory=$(pwd)"
          echo "Environment Dump"
          printenv | sort
#      - name: List project files
#        run: |
#          ls -dRla "$(pwd)/.."
      - name: Check code formatting
        run: |
          # Prevent error when fetching.
          git config --global --add safe.directory '*'
          if [[ -f check-format.sh ]]; then ./check-format.sh; fi

  # ------------------------------------------------------------------
  # build: Builds and packages every toolchain.
  # ------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: [check-env, linux-gcov]
    # Run when check-env passed and linux-gcov either succeeded or was skipped (push, coverage disabled).
    # '!cancelled()' is required: without a status function the implicit 'success()' skips this job
    # whenever linux-gcov was skipped.
    if: >-
      ${{ !cancelled()
      && !inputs.skip_build
      && needs.check-env.result == 'success'
      && (needs.linux-gcov.result == 'success' || needs.linux-gcov.result == 'skipped') }}
    runs-on: *runs-on
    timeout-minutes: *build-timeout
    container: *build-container
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env: &nexus-env
      DEBUG: ${{ vars.ENTRY_DEBUG }}
      NEXUS_USER: ${{ vars.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_SERVER_URL: ${{ vars.NEXUS_SERVER_URL }}
      NEXUS_APT_REPO: ${{ vars.NEXUS_APT_REPO }}
      NEXUS_RAW_REPO: ${{ vars.NEXUS_RAW_REPO }}
      NEXUS_RAW_SUBDIR: ${{ vars.NEXUS_RAW_SUBDIR }}
      NEXUS_EXCHANGE_REPO: ${{ vars.NEXUS_EXCHANGE_REPO }}
      NEXUS_WINGET_REFRESH: ${{ vars.NEXUS_WINGET_REFRESH }}
    steps:
      # The full history and tags are needed for versioning of shared libraries and packaging.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build
        uses: scanframe-org/sf-workflows/.github/actions/build-job@main
        with:
          job-name: ${{ matrix.name }}
          build-cmd: ${{ matrix.build-cmd }} --workflow "${{ matrix.toolchain }}-release"
          bin-dir: ${{ matrix.bin-dir }}
          pkg-dir: ${{ env.SF_DIR_PKG }}

  # ------------------------------------------------------------------
  # linux-gcov: Coverage build using the GNU toolchain and reports the coverage.
  # Runs for push, pull requests, and manual dispatches; skipped otherwise.
  # ------------------------------------------------------------------
  linux-gcov:
    if: inputs.coverage && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: [check-env]
    runs-on: *runs-on
    timeout-minutes: *build-timeout
    # Commenting the coverage report on the pull request needs 'pull-requests: write'.
    permissions:
      contents: read
      pull-requests: write
    container: *build-container
    env: *nexus-env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Prepare output directories for the build user
        shell: bash
        run: |
          for dir in "${SF_GCOVR_DIR}" "${SF_DIR_PKG}" ; do
          [[ -z "${dir}" ]] && continue
          mkdir -p "${dir}"
          # Open the directory and all its existing subdirectories.
          find "${dir}" -type d -exec chmod 777 {} +
          # Open the parent directories up to the workspace root (e.g. 'bin').
          parent="$(dirname "${dir}")"
          while [[ "${parent}" != "." && "${parent}" != "/" ]]; do
           chmod 777 "${parent}"
           parent="$(dirname "${parent}")"
          done
          done
      - name: Build coverage
        uses: scanframe-org/sf-workflows/.github/actions/build-job@main
        with:
          job-name: linux-gcov
          build-cmd: /home/user/bin/entrypoint.sh ./build.py native --verbose --workflow "gnu-coverage"
          upload-binaries: 'false'
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: ${{ env.SF_GCOVR_DIR }}/report.txt
          retention-days: 7
          if-no-files-found: error
      - name: Publish and report coverage
        uses: scanframe-org/sf-workflows/.github/actions/coverage-report@main
        with:
          gcovr-dir: ${{ env.SF_GCOVR_DIR }}
          exchange-dir: ${{ env.SF_EXCHANGE_DIR }}

  # ------------------------------------------------------------------
  # deploy-develop: Deploys automatically to Nexus for all but the release branch.
  # ------------------------------------------------------------------
  deploy-develop:
    needs: [build]
    if: >-
      github.ref_name != (vars.SF_RELEASE_BRANCH || 'main') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: *runs-on
    timeout-minutes: &deploy-timeout 30
    # Deploying does not need the privileged option.
    container:
      image: *build-image
    env: *nexus-env
    steps: &deploy-steps
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Deploy
        uses: scanframe-org/sf-workflows/.github/actions/deploy-job@main
        with:
          pkg-dir: ${{ env.SF_DIR_PKG }}

  # ------------------------------------------------------------------
  # deploy-staging: Manual deploy to Nexus from the release branch.
  # Uses the secrets of the GitHub environment 'staging'.
  # ------------------------------------------------------------------
  deploy-staging:
    needs: [build]
    if: inputs.deploy == 'staging' && github.ref_name == (vars.SF_RELEASE_BRANCH || 'main')
    runs-on: *runs-on
    timeout-minutes: *deploy-timeout
    environment: staging
    container:
      image: *build-image
    env: *nexus-env
    steps: *deploy-steps

  # ------------------------------------------------------------------
  # deploy-stable: Manual deploy to Nexus from the release branch.
  # Uses the secrets of the GitHub environment 'stable'.
  # ------------------------------------------------------------------
  deploy-stable:
    needs: [build]
    if: inputs.deploy == 'stable' && github.ref_name == (vars.SF_RELEASE_BRANCH || 'main')
    runs-on: *runs-on
    timeout-minutes: *deploy-timeout
    environment: stable
    container:
      image: *build-image
    env: *nexus-env
    steps: *deploy-steps
